# /etc/rustical/config.toml — Omnical (RustiCal 0.16.1) on the libreCMC router.
# Authoritative key names: `rustical gen-config`. Env overrides: RUSTICAL_* (figment,
# sections split by "__", e.g. RUSTICAL_DATA_STORE__SQLITE__DB_URL).

[http]
# Do NOT set http.host here: in RustiCal 0.16.1 it is a DEPRECATED BIND OVERRIDE
# (takes precedence over `bind`, would make rustical try to bind
# 0115d8cf.duckdns.org:4000 and fail). URLs in responses are generated from each
# request's Host header, which correctly carries 0115d8cf.duckdns.org:8443 via dav-tls.
bind = "127.0.0.1:4000"          # only dav-tls (and local curl) talk to it
payload_limit_mb = 32

[data_store.sqlite]
db_url = "file:/usr/local/share/rustical/db.sqlite3"   # persistent overlay — NOT /var (tmpfs!)

[frontend]
# HawkBook (the DAVx⁵ fork) is served as a download from this deployment —
# the profile intro links it and prints its sha256. The file itself is NOT
# in this repo (18 MB, and it is a build artifact of the app, not of this
# one): out/hawkbook.apk → /usr/local/share/rustical/downloads/hawkbook.apk
# on the router, pushed by deploy.sh. The whole /usr/local/share/rustical
# tree survives sysupgrade (/etc/sysupgrade.conf), so this key stays valid.
# Missing file ⇒ the binary warns, the route 404s and the intro omits the
# link — never a link at something it cannot serve.
hawkbook_apk = "/usr/local/share/rustical/downloads/hawkbook.apk"

# [dav_push] — defaults for now; enable WebSocket/WebPush transport after Phase 7 tests.

# [nextcloud_login] — enabled by default; required for the DAVx5 login flow.
