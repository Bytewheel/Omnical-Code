# Omnical — test + lint
#
# Runs the fork's own test suite. The integration baseline is **98** tests in
# tests/run_integration_tests.rs, verified at the fork's pinned commit
# `dba08b2f` on 2026-09-28. That number is the safety net for the tenancy
# refactor in PLAN_DEPLOYMENTS.md §6.1: the `make_app` -> `make_app_for`
# extraction MUST pass it with zero test edits. A test edit during a refactor
# means behaviour changed.
#
# ON THE NUMBER, because it was wrong for a while and the wrongness mattered.
# This file asserted 96, citing PLAN.md §17.16 (2026-09-23). That figure was a
# mid-day snapshot on the same day the suite last grew: the last commits
# touching tests/integration_tests/ are 3d2f4249 and dba08b2f, both 2026-09-23,
# and by `dba08b2f` the suite is 98. So the assertion was not merely stale
# documentation — it was a FLOOR set two tests below reality, which means a
# refactor that quietly deleted two tests would have passed this check. That is
# the exact failure the check exists to catch, so the floor is now the real
# count. Re-derive it with
#   cargo test --test run_integration_tests -- --list | tail -1
# if the suite ever changes on purpose, and update this number in the same
# commit.
#
# SQLX_OFFLINE=true is REQUIRED, not optional: 42 compile-time-checked
# `sqlx::query!` macros exist and the .sqlx/ query cache (70 files) is
# committed. Without the env var cargo demands a live DATABASE_URL and the
# build fails. scripts/build-rust.sh:34 sets it for builds; this workflow must
# set it for tests.

name: test

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

defaults:
  run:
    working-directory: rustical

jobs:
  test:
    name: cargo test (workspace)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.0
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            rustical
            dav-tls
          key: test-${{ hashFiles('rustical/Cargo.lock') }}

      - name: Unit + integration tests
        env:
          SQLX_OFFLINE: "true"
        run: |
          set -euo pipefail
          cargo test --workspace --all-features 2>&1 | tee /tmp/test.log
          echo "=== summary ==="
          grep -E "^test result:" /tmp/test.log

      # PLAN_DEPLOYMENTS.md §8.4 / §12 row 43: the §14 row-18 restore drill,
      # promoted from a manual exercise to a release gate. Run as its own step
      # so a backup regression is legible in the CI log instead of buried in
      # the workspace run above — this is the test that says "a backup taken by
      # this binary restores on another machine", which is the only claim
      # anybody makes about a backup.
      - name: Backup/restore drill (row 43)
        env:
          SQLX_OFFLINE: "true"
        run: |
          set -euo pipefail
          cargo test --test backup_restore 2>&1 | tee /tmp/backup.log
          n=$(grep -oE "^test result: ok\. [0-9]+" /tmp/backup.log \
              | awk '{s+=$4} END {print s+0}')
          echo "backup/restore tests passed: $n"
          if [ "$n" -lt 12 ]; then
            echo "::error::only $n backup/restore tests passed — the restore drill shrank"
            exit 1
          fi

      # PLAN_DEPLOYMENTS.md §8.2 / §12 row 44: the wizard must be re-runnable.
      # The gate is the second run — a re-run that edits rather than clobbers,
      # keeping the database, the administrator and its password. A wizard
      # test that only ever does a first run cannot see the bug this exists to
      # prevent, so this is its own step with its own floor.
      - name: Setup wizard idempotence (row 44)
        env:
          SQLX_OFFLINE: "true"
        run: |
          set -euo pipefail
          cargo test --test setup_wizard 2>&1 | tee /tmp/setup.log
          n=$(grep -oE "^test result: ok\. [0-9]+" /tmp/setup.log \
              | awk '{s+=$4} END {print s+0}')
          echo "setup wizard tests passed: $n"
          if [ "$n" -lt 8 ]; then
            echo "::error::only $n setup wizard tests passed — the idempotence gate shrank"
            exit 1
          fi

      - name: Assert the integration baseline did not shrink
        if: always()
        env:
          SQLX_OFFLINE: "true"
        run: |
          set -euo pipefail
          # A silent drop in test count is how a refactor quietly deletes
          # coverage. The integration runner is a separate test target, so
          # assert it directly rather than inferring from the workspace run.
          #
          # 98, not 96 — see the header for why the old floor was two tests
          # below reality, which made this check unable to catch the loss it
          # exists to catch. `listed` is cross-checked against `n` so a
          # *renamed* or *removed* test is caught even if a replacement keeps
          # the count up: the tenancy refactor's promise is "zero test edits",
          # and an edit that swaps one test for another is still an edit.
          cargo test --test run_integration_tests 2>&1 | tee /tmp/integration.log
          grep -E "^test result:" /tmp/integration.log
          n=$(grep -oE "^test result: ok\. [0-9]+" /tmp/integration.log \
              | awk '{s+=$4} END {print s+0}')
          echo "integration tests passed: $n"
          if [ "$n" -ne 98 ]; then
            echo "::error::the integration baseline is 98 tests; $n ran. A refactor must"
            echo "::error::not change this number, and a change here means a test was"
            echo "::error::added, deleted or renamed. Update this file in the same commit"
            echo "::error::if that was deliberate."
            exit 1
          fi
          # The test *names* are the refactor's real gate, so pin them too. A
          # count alone cannot catch a delete-and-replace that holds the total
          # at 98, and §6.1's promise is "zero test edits" — an edit that swaps
          # one test for another is still an edit.
          #
          # LC_ALL=C is not optional, and this was proved the hard way: the first
          # CI run of this check reported the right count (98) and the wrong
          # digest. `sort` is locale-sensitive and these names are full of
          # underscores and mixed case, which collate differently under
          # en_US.UTF-8 than under C — the same 98 tests hashed to two different
          # values, so a pin computed in one locale was unpassable in the other.
          # Byte order has no such opinions and is identical everywhere, which is
          # the whole requirement for a value that gets pasted between machines.
          expected_digest=e7760b76f4aff9a233ed59fcade2518c9692e5296e4af7b0850ef200f64fad9e
          listed=$(cargo test --test run_integration_tests -- --list 2>/dev/null \
              | grep -oE '^integration_tests::.*: test$' | LC_ALL=C sort)
          count=$(printf '%s\n' "$listed" | grep -c .)
          if [ "$count" -ne "$n" ]; then
            echo "::error::--list reports $count tests but the run reported $n"
            exit 1
          fi
          actual_digest=$(printf '%s\n' "$listed" | sha256sum | cut -d' ' -f1)
          echo "integration test-name digest: $actual_digest"
          if [ "$actual_digest" != "$expected_digest" ]; then
            echo "::error::the set of integration test NAMES changed (expected"
            echo "::error::$expected_digest, got $actual_digest)."
            echo "::error::§6.1's refactor gate is 'zero test edits'. If a test was"
            echo "::error::deliberately added, deleted or renamed, update"
            echo "::error::expected_digest in this file in the same commit."
            exit 1
          fi
          echo "ok: $n integration tests, names match the pinned digest"

  fmt:
    name: cargo fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.0
          components: rustfmt
      - run: cargo fmt --all --check
        working-directory: rustical

  clippy:
    name: cargo clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.0
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rustical
          key: clippy-${{ hashFiles('rustical/Cargo.lock') }}

      - name: Clippy
        # NOTE: rustical/src/lib.rs:1 sets
        #   #![warn(clippy::all, clippy::pedantic, clippy::nursery)]
        # so a -D warnings gate would fail immediately on the pre-existing
        # upstream pedantic/nursery surface. This fails on clippy *errors*
        # (cargo exits non-zero) and publishes the warning log so the count can
        # be tracked as a ratchet. Tightening to -D warnings is a deliberate
        # follow-up (PLAN_DEPLOYMENTS.md §5.4), not something to fake here.
        run: |
          set -euo pipefail
          cargo clippy --workspace --all-targets --all-features 2>&1 \
            | tee /tmp/clippy.log || {
              echo "::error::clippy reported errors (see log below)"
              grep -E "^error" /tmp/clippy.log | head -30
              exit 1
            }
          echo "=== warning count (ratchet, not a gate) ==="
          grep -cE "^warning: " /tmp/clippy.log || echo 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: clippy-log
          path: /tmp/clippy.log
          retention-days: 7

  # ── AGPL §13 source offer (§10.3, item 19) ─────────────────────────────────
  # "on a running hosted instance, an anonymous client can reach /frontend/source,
  # download a tarball whose `git rev-parse HEAD` matches the running binary's
  # build, and the tarball builds. Test this in CI, not by eye."
  #
  # `tests/source_offer.rs` covers the part a unit test can: that the page
  # refuses to name a commit it does not have, and withholds an unverifiable
  # tarball link. This job covers the rest, which needs two real artefacts — the
  # release binary and the tarball it was built from — and the comparison is the
  # whole of the compliance check.
  #
  # A page that renders correctly and points at the wrong tree is a §13 failure
  # that looks like a working feature, which is why this is a job.
  source-offer:
    name: AGPL source offer matches the built binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          # The tarball must carry a .git for `git rev-parse HEAD` to work. A
          # `git archive` strips it, and then the offer's commit cannot be
          # checked at all — which the gate reports rather than assuming.
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.0

      - name: Build the release binary (bakes in the commit)
        working-directory: rustical
        run: |
          set -euo pipefail
          export SQLX_OFFLINE=true
          # A clean tree, so `build.rs` does not stamp DIRTY and the page's
          # dirty-build warning is not what this job is testing.
          cargo build --release
          ./target/release/rustical support-bundle --stdout --no-config | grep '^commit:'

      - name: Pack the source at that same commit
        run: |
          set -euo pipefail
          tar czf /tmp/source.tar.gz --exclude=target rustical
          echo "packed $(tar tzf /tmp/source.tar.gz | wc -l) entries"

      - name: §10.3 gate — the offer matches the binary, and the offer builds
        run: ./scripts/source-offer-gate.sh rustical/target/release/rustical /tmp/source.tar.gz
