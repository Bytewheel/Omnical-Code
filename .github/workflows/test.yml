# Omnical — test + lint
#
# Runs the fork's own test suite. The integration baseline is 96 tests in
# tests/run_integration_tests.rs (PLAN.md §17.16, 2026-09-23). That number is
# the safety net for the tenancy refactor in PLAN_DEPLOYMENTS.md §6.1: the
# `make_app` -> `make_app_for` extraction MUST pass it with zero test edits.
# A test edit during a refactor means behaviour changed.
#
# SQLX_OFFLINE=true is REQUIRED, not optional: 42 compile-time-checked
# `sqlx::query!` macros exist and the .sqlx/ query cache (70 files) is
# committed. Without the env var cargo demands a live DATABASE_URL and the
# build fails. scripts/build-rust.sh:34 sets it for builds; this workflow must
# set it for tests.

name: test

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

defaults:
  run:
    working-directory: rustical

jobs:
  test:
    name: cargo test (workspace)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.0
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            rustical
            dav-tls
          key: test-${{ hashFiles('rustical/Cargo.lock') }}

      - name: Unit + integration tests
        env:
          SQLX_OFFLINE: "true"
        run: |
          set -euo pipefail
          cargo test --workspace --all-features 2>&1 | tee /tmp/test.log
          echo "=== summary ==="
          grep -E "^test result:" /tmp/test.log

      # PLAN_DEPLOYMENTS.md §8.4 / §12 row 43: the §14 row-18 restore drill,
      # promoted from a manual exercise to a release gate. Run as its own step
      # so a backup regression is legible in the CI log instead of buried in
      # the workspace run above — this is the test that says "a backup taken by
      # this binary restores on another machine", which is the only claim
      # anybody makes about a backup.
      - name: Backup/restore drill (row 43)
        env:
          SQLX_OFFLINE: "true"
        run: |
          set -euo pipefail
          cargo test --test backup_restore 2>&1 | tee /tmp/backup.log
          n=$(grep -oE "^test result: ok\. [0-9]+" /tmp/backup.log \
              | awk '{s+=$4} END {print s+0}')
          echo "backup/restore tests passed: $n"
          if [ "$n" -lt 12 ]; then
            echo "::error::only $n backup/restore tests passed — the restore drill shrank"
            exit 1
          fi

      - name: Assert the integration baseline did not shrink
        if: always()
        env:
          SQLX_OFFLINE: "true"
        run: |
          set -euo pipefail
          # A silent drop in test count is how a refactor quietly deletes
          # coverage. The integration runner is a separate test target, so
          # assert it directly rather than inferring from the workspace run.
          cargo test --test run_integration_tests 2>&1 | tee /tmp/integration.log
          grep -E "^test result:" /tmp/integration.log
          n=$(grep -oE "^test result: ok\. [0-9]+" /tmp/integration.log \
              | awk '{s+=$4} END {print s+0}')
          echo "integration tests passed: $n"
          if [ "$n" -lt 96 ]; then
            echo "::error::only $n integration tests passed — the 96-test baseline regressed"
            exit 1
          fi

  fmt:
    name: cargo fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.0
          components: rustfmt
      - run: cargo fmt --all --check
        working-directory: rustical

  clippy:
    name: cargo clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.0
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rustical
          key: clippy-${{ hashFiles('rustical/Cargo.lock') }}

      - name: Clippy
        # NOTE: rustical/src/lib.rs:1 sets
        #   #![warn(clippy::all, clippy::pedantic, clippy::nursery)]
        # so a -D warnings gate would fail immediately on the pre-existing
        # upstream pedantic/nursery surface. This fails on clippy *errors*
        # (cargo exits non-zero) and publishes the warning log so the count can
        # be tracked as a ratchet. Tightening to -D warnings is a deliberate
        # follow-up (PLAN_DEPLOYMENTS.md §5.4), not something to fake here.
        run: |
          set -euo pipefail
          cargo clippy --workspace --all-targets --all-features 2>&1 \
            | tee /tmp/clippy.log || {
              echo "::error::clippy reported errors (see log below)"
              grep -E "^error" /tmp/clippy.log | head -30
              exit 1
            }
          echo "=== warning count (ratchet, not a gate) ==="
          grep -cE "^warning: " /tmp/clippy.log || echo 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: clippy-log
          path: /tmp/clippy.log
          retention-days: 7
