# Omnical — cross-compile matrix
#
# Builds the same static binaries the router gets, so PLAN_BINARY_SIZE.md's
# 35 MiB overlay budget is enforced on every push instead of being discovered
# on a device with 27 MB of free space.
#
# Targets mirror scripts/build-rust.sh:36-100, which supports exactly two:
#   aarch64-unknown-linux-musl   -> the appliance/router (RK3328, ThinkPenguin)
#   x86_64-unknown-linux-gnu     -> host smoke tests
# A third target is NOT added here without also teaching build-rust.sh about
# it — the script exits 1 on anything else, so CI would fail misleadingly.

name: build

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  aarch64-musl:
    name: aarch64-unknown-linux-musl (appliance / router)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # The runner ships a Rust, but not this one and not this target. Without
      # them the cross build dies with `can't find crate for core` / `the
      # aarch64-unknown-linux-musl target may not be installed` — which reads
      # like a broken toolchain recipe rather than a missing std component, and
      # only appears once the earlier failures in this job are out of the way.
      # Pinned to 1.97.0 like every other job, because `rustical/Cargo.toml`
      # declares `rust-version = 1.97` and an unpinned `stable` would drift.
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.0
          targets: aarch64-unknown-linux-musl

      # build-rust.sh:69 harvests musl include dirs from `zig libc` because
      # plain clang has no musl sysroot on a generic host and silently falls
      # back to glibc headers, which breaks aws-lc-sys. See its header comment
      # (lines 14-22) for the three rejected toolchain combinations — do not
      # "simplify" this away.
      - name: Install zig (musl sysroot) and clang/llvm
        run: |
          set -euo pipefail
          # Pinned to the version the 2026-09-04 recipe was validated against, and
          # the one scripts/build-rust.sh is known to work with locally.
          ZIG_VERSION=0.16.0
          # The archive name is `zig-<arch>-<os>-<version>`, NOT the pre-0.12
          # `zig-<os>-<arch>-<version>`. Zig reordered those components in 0.12,
          # and this step kept the old spelling, so the URL 404'd and the job
          # died on `xz: (stdin): File format not recognized` — a tarball that
          # was never a tarball, piped straight from curl into tar. The same
          # reordering applies to the extracted directory name below, so getting
          # only one of the two right moves the failure rather than fixing it.
          ZIG_PKG="zig-x86_64-linux-${ZIG_VERSION}"
          ZIG_URL="https://ziglang.org/download/${ZIG_VERSION}/${ZIG_PKG}.tar.xz"
          # Pinned from ziglang.org/download/index.json and verified against the
          # downloaded bytes. Downloading a whole toolchain over TLS and running
          # whatever arrives is a supply-chain hole in a repository that has to be
          # publishable (AGPL §13), and this is the one place in CI that fetches
          # an executable. A digest fetched from the same host as the tarball
          # would prove nothing, so the expected value is a literal here.
          ZIG_SHA256=70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00

          curl -fsSL -o /tmp/zig.tar.xz "$ZIG_URL"
          echo "${ZIG_SHA256}  /tmp/zig.tar.xz" | sha256sum --check --strict
          sudo tar -xJf /tmp/zig.tar.xz -C /usr/local

          # $GITHUB_PATH takes effect for LATER steps only, so exporting here is
          # what makes `zig version` work in *this* step, and writing
          # $GITHUB_PATH is what makes it work in the build step. Doing only one
          # of the two is a trap the original step fell into: it wrote
          # $GITHUB_PATH and then immediately called `zig version`, which could
          # never resolve. It only looked plausible because the step died one
          # line earlier, on the 404.
          echo "ZIG_VERSION=${ZIG_VERSION}" >> "$GITHUB_ENV"
          echo "/usr/local/${ZIG_PKG}" >> "$GITHUB_PATH"
          export PATH="/usr/local/${ZIG_PKG}:$PATH"
          zig version
          # clang/llvm ship with the runner already, but pin what we depend on.
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang llvm lld upx-ucl
          clang --version | head -1

      - name: Cache cargo target dir
        uses: actions/cache@v4
        with:
          path: build/cargo-target
          key: build-aarch64-${{ hashFiles('rustical/Cargo.lock', 'dav-tls/Cargo.lock') }}
          restore-keys: build-aarch64-

      - name: Build
        env:
          # build-rust.sh:126 hardcodes /usr/lib/llvm/22/bin/llvm-strip; point
          # it at whatever this runner has so the .comment strip actually runs
          # instead of being silently skipped by the [ -x ] guard.
          LLVM_STRIP: /usr/bin/llvm-strip
        run: ./scripts/build-rust.sh aarch64-unknown-linux-musl

      - name: Assert the 35 MiB overlay budget (plan constraint C2)
        run: |
          set -euo pipefail
          budget=$((35 * 1024 * 1024))
          for bin in rustical dav-tls; do
            bytes=$(stat -c%s "out/$bin")
            echo "$bin: $((bytes/1024)) KiB"
            if [ "$bytes" -gt "$budget" ]; then
              echo "::error::$bin is $((bytes/1024/1024)) MiB — over the 35 MiB overlay budget"
              exit 1
            fi
          done
          echo "ok: both binaries fit the budget"
          echo "note: the appliance overlay budget is what makes UPX mandatory;"
          echo "      a non-UPX rustical is ~15.9 MiB and would still 'fit', so"
          echo "      this check alone does not prove compression happened."

      - name: Assert static + UPX-packed
        run: |
          set -euo pipefail
          for bin in rustical dav-tls; do
            file "out/$bin" | grep -q aarch64 || { echo "::error::$bin is not aarch64"; exit 1; }
            # `file` on a UPX-packed aarch64 static binary: must not need a loader.
            ldd "out/$bin" 2>&1 | grep -qi "not a dynamic executable" \
              || { echo "::warning::could not confirm static linking of $bin (UPX rewrites the header)"; }
          done
          echo "ok: aarch64 static binaries produced"

      - uses: actions/upload-artifact@v4
        with:
          name: binaries-aarch64-musl
          path: out/rustical
          retention-days: 14

  x86_64-gnu:
    name: x86_64-unknown-linux-gnu (host smoke test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.0

      - name: Cache cargo target dir
        uses: actions/cache@v4
        with:
          path: build/cargo-target
          key: build-x86_64-${{ hashFiles('rustical/Cargo.lock', 'dav-tls/Cargo.lock') }}
          restore-keys: build-x86_64-

      - name: Build
        run: ./scripts/build-rust.sh x86_64-unknown-linux-gnu

      - name: Smoke test the binary
        run: |
          set -euo pipefail
          BIN=out/x86_64-unknown-linux-gnu/rustical
          test -x "$BIN"
          # gen-config is the cheapest end-to-end proof that the binary links,
          # starts, and its clap/figment config layer initialises.
          "$BIN" gen-config > /tmp/generated.toml
          test -s /tmp/generated.toml
          grep -q 'data_store' /tmp/generated.toml
          "$BIN" --version
          echo "ok: binary runs and emits a config template"

      - uses: actions/upload-artifact@v4
        with:
          name: binaries-x86_64-gnu
          path: out/x86_64-unknown-linux-gnu
          retention-days: 14

  # ── The self-hosting channels ─────────────────────────────────────────────
  # PLAN_DEPLOYMENTS.md §8.1, verification-matrix rows 40 and 41. A GitHub
  # runner is the "bare VM" row 41 asks for, so this job installs with
  # packaging/native/install.sh and then actually uses the result: boots the
  # server on the config the wizard wrote, drives a CalDAV round trip, and
  # registers a user through the invite flow.
  #
  # It is here rather than in test.yml because it needs the *release* binary,
  # and build.yml is the workflow that already produces one per target.
  #
  # This job runs no container on purpose. Executing a container runtime is a
  # stretch goal (§18.7): the self-host channel stands on its own, and the job
  # instead asserts everything in compose.omnical.yml that can rot without one —
  # the wizard variable set in both directions, the data-dir/db-url pairing, the
  # service ordering — plus the substance of row 40 run against the release
  # binary. See scripts/selfhost-gate.sh.
  selfhost:
    name: self-host channels (rows 40-41)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.0

      - name: Cache cargo target dir
        uses: actions/cache@v4
        with:
          path: build/cargo-target
          key: build-x86_64-${{ hashFiles('rustical/Cargo.lock', 'dav-tls/Cargo.lock') }}
          restore-keys: build-x86_64-

      - name: Build the host release binary
        run: ./scripts/build-rust.sh x86_64-unknown-linux-gnu

      - name: The install, the wizard, the server, a client, a registration
        run: |
          set -euo pipefail
          ./scripts/selfhost-gate.sh out/x86_64-unknown-linux-gnu/rustical

      - name: The Compose file is valid YAML and declares both services
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import sys, yaml
          doc = yaml.safe_load(open("compose.omnical.yml"))
          services = doc.get("services", {})
          missing = {"omnical-setup", "omnical"} - set(services)
          if missing:
              sys.exit(f"compose.omnical.yml is missing services: {sorted(missing)}")
          setup = services["omnical-setup"]
          # The gate, restated where the Compose runtime will read it: the server
          # must wait for the wizard, or the first request races it.
          cond = services["omnical"].get("depends_on", {}).get(
              "omnical-setup", {}).get("condition")
          if cond != "service_completed_successfully":
              sys.exit(f"the server does not wait for setup (condition={cond!r})")
          if "--unattended" not in setup.get("command", []):
              sys.exit("the setup service does not run `setup --unattended`")
          print("ok: compose.omnical.yml parses, declares both services, and orders them")
          PY

      - name: The shell scripts are syntactically valid
        run: |
          set -euo pipefail
          for f in packaging/native/install.sh scripts/selfhost-gate.sh; do
            bash -n "$f"
            echo "ok: $f"
          done
          # shellcheck is not preinstalled on the runner and apt-installing a
          # linter for a two-file gate is not worth the supply chain; bash -n
          # plus actually running the scripts is the stronger check anyway.
          test -x packaging/native/install.sh || { echo "::error::install.sh is not executable"; exit 1; }
          test -x scripts/selfhost-gate.sh   || { echo "::error::selfhost-gate.sh is not executable"; exit 1; }
