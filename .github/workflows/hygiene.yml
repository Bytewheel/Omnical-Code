# Omnical — repo hygiene
#
# This is the workflow that would have caught PLAN_DEPLOYMENTS.md §5.1's H1 and
# H2 before they were committed: a live Let's Encrypt PRIVATE KEY in out/tls/
# and 15 real CalDAV/CardDAV app tokens in out/omnical-iphone.mobileconfig,
# both tracked for months. Since the AGPL-3.0 §13 decision
# (PLAN_DEPLOYMENTS.md §10) this repository must be PUBLISHABLE — the hosted
# deployment has to offer the running source to every network user. A
# credential in the history of a public repo is a disclosure incident, not a
# mess to tidy later.
#
# So: anything that is a build product or a credential must never be tracked.
# This workflow enforces that on every push and PR.

name: hygiene

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  # ── 1. No secrets anywhere in the tree or the history ──────────────────────
  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: a secret that was committed and later deleted is still
          # in the history. This is exactly how H1/H2 would have been found.
          fetch-depth: 0
          submodules: false

      # The gitleaks **CLI** rather than `gitleaks/gitleaks-action@v2`.
      #
      # The action started requiring a paid licence key for organisation-owned
      # repositories, and this run died on `[Bytewheel] is an organization.
      # License key is required.` before scanning a single byte. The scanner
      # itself is still free (AGPL-3.0); only the convenience wrapper is gated,
      # so running the binary directly does the identical scan for free.
      #
      # This matters more than a broken badge: per §5.1 this scan is the control
      # that would have caught the live TLS private key and the 15 real CalDAV
      # app tokens that sat in the history for months. A licence wall silently
      # removing it would leave the repository publishable-looking and unscanned.
      #
      # `--no-banner` keeps the log readable. The image is pinned to a release
      # tag rather than `latest`; pinning by digest would be stricter still, and
      # is the right thing to do for a repository that must be publishable.
      - name: gitleaks scan (full history)
        run: |
          set -euo pipefail
          # --config is explicit on purpose. gitleaks auto-loads .gitleaks.toml
          # from the source directory, and relying on that means a config that
          # fails to be found turns the scan into a *silently different* scan
          # rather than an error — the one thing a secret scanner must never be.
          docker run --rm \
            -v "$PWD:/repo" \
            zricethezav/gitleaks:v8.28.0 \
            detect --source=/repo --config=/repo/.gitleaks.toml \
              --redact --verbose --no-banner

      # trufflehog is pinned to a tag rather than `@main`: a third-party action
      # tracked to a moving branch is a supply-chain hole in the one workflow
      # whose job is to distrust input.
      - name: trufflehog scan (filesystem, uncommitted included)
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified --results=verified,unknown

  # ── 2. The tracked-file policy, asserted directly ─────────────────────────
  tracked-files:
    name: tracked-file policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Assert no build artefacts are tracked
        run: |
          set -euo pipefail
          fail=0
          check() { # <label> <regex>
            local label="$1" re="$2" hits
            hits=$(git ls-files | grep -E "$re" || true)
            if [ -n "$hits" ]; then
              echo "::error::$label must not be tracked:"; echo "$hits" | head -20
              fail=1
            else
              echo "ok: $label not tracked"
            fi
          }
          # H3: 33,998 files of build/cargo-target/ (3.3 GB of .git)
          check "build/cargo-target/" '(^|/)build/cargo-target/'
          check "any cargo target dir" '(^|/)target/'
          # H5: compiled binaries
          check "out/ build output"        '^out/'
          check "zig cache"                 '(^|/)\.zig-cache/'
          # H1/H2 classes
          check "TLS private key material" '\.key$|\.key\.pem$|^out/tls/'
          check "Apple profiles (app tokens)" '\.mobileconfig$'
          check "secret stores"             '^(secrets|pass)/|^\.env'
          # NOTE: *.pem is intentionally NOT blanket-checked. One public CA
          # cert must stay tracked — see the allowlist assertion below.
          exit $fail

      - name: Assert the one allowed .pem is a public trust anchor
        run: |
          set -euo pipefail
          pem=router/etc/rustical/certs/imap-novo-ordo.pem
          git ls-files | grep -E '\.pem$' | while read -r f; do
            [ "$f" = "$pem" ] || { echo "::error::unexpected tracked .pem: $f"; exit 1; }
          done
          # Must parse as a CERTIFICATE, and must be signed by a public CA.
          # If this ever parses as a private key, the allowlist has rotted.
          openssl x509 -in "$pem" -noout -text >/dev/null
          if grep -q "PRIVATE KEY" "$pem"; then
            echo "::error::$pem contains a PRIVATE KEY — remove it and the allowlist entry"
            exit 1
          fi
          echo "ok: $pem is a public certificate ($(openssl x509 -in "$pem" -noout -subject))"

      - name: Assert the submodule is properly declared  # H4
        run: |
          set -euo pipefail
          # Pre-H4 this repo had a gitlink and NO .gitmodules, so `git clone`
          # produced an EMPTY rustical/ and the build could not start at all.
          test -f .gitmodules || { echo "::error::.gitmodules missing (H4 regression)"; exit 1; }
          grep -q 'submodule "rustical"' .gitmodules || { echo "::error::rustical submodule not declared"; exit 1; }
          # The submodule must actually be checked out in CI, not empty.
          test -f rustical/Cargo.toml || { echo "::error::rustical/ is EMPTY — submodule not initialised"; exit 1; }
          test -d rustical/crates || { echo "::error::rustical/crates missing"; exit 1; }
          echo "ok: submodule declared and populated ($(ls rustical/crates | wc -l) crates)"

      - name: Report repo size (regression guard for H3)
        run: |
          set -euo pipefail
          size=$(git count-objects -vH | awk '/^size-pack:/ {print $2}')
          echo "packed repo size: ${size:-unknown}"
          # The pre-cleanup repo was 3.3 GB. Fail loudly if artefacts creep back.
          bytes=$(du -sb .git | cut -f1)
          if [ "$bytes" -gt 524288000 ]; then
            echo "::error::.git is $((bytes/1024/1024)) MiB — build artefacts are being tracked again"
            exit 1
          fi
          echo "ok: .git is $((bytes/1024/1024)) MiB (under the 500 MiB guard)"

  # ── 4. The appliance firmware recipe and its postinst ─────────────────────
  # PLAN_DEPLOYMENTS.md §9.2 (item 12). A sysupgrade wipes /usr/sbin/rustical,
  # /usr/sbin/dav-tls, both custom init scripts and the watchdog, which is why
  # every firmware update currently needs a laptop, SSH and the `pass` store.
  # The fix is a sysupgrade image, and the postinst is the part that can silently
  # destroy a customer's configuration — it runs on every flash, forever, with
  # nobody watching. That is exactly the kind of code that ships broken if no
  # test ever runs it, and it needs no hardware: the recipe and the postinst are
  # committed text, so this is a two-second job.
  #
  # It does NOT claim §9.2's gate or rows 46/48/51, which need a flashed unit.
  # The script says so itself, in section 7, so a reader cannot mistake a green
  # run for a hardware pass.
  firmware:
    name: firmware recipe gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Firmware recipe + postinst gate
        run: ./scripts/firmware-gate.sh

      - name: The staged payload is never tracked
        run: |
          set -euo pipefail
          # build-firmware.sh stages the compiled binaries into the package's
          # files/ dir. They are build products (the same ones out/ holds) and
          # this repo must stay publishable, so a tracked one is a regression of
          # the H3/H5 class — a 4.85 MiB binary in a repo that AGPL §13 requires
          # us to offer to every network user.
          hits=$(git ls-files | grep -E '^packaging/firmware/omnical/files/(rustical|dav-tls|config\.toml|init\.d/)' || true)
          if [ -n "$hits" ]; then
            echo "::error::staged firmware payload must not be tracked:"; echo "$hits"
            exit 1
          fi
          echo "ok: only text (recipe, postinst, keep list) is tracked"

      - name: The postinst survives mutation (the gate is not vacuous)
        run: |
          set -euo pipefail
          # A gate that cannot fail is worse than no gate, because it is read as
          # coverage. Break the one line that matters — the guard that keeps a
          # preserved config.toml from being overwritten — and require the gate
          # to notice. This caught exactly this class of bug during development:
          # the first version of the recipe check matched a *comment* in the
          # Makefile, so deleting the install line it was supposed to be testing
          # still reported ok.
          cp packaging/firmware/omnical/files/postinst /tmp/postinst.orig
          cp router/etc/init.d/rustical /tmp/initd.orig

          # Three mutations, applied with **python3 and exact string
          # replacement** rather than sed. Two earlier versions used sed and both
          # were wrong in ways this step cannot afford:
          #
          #   1. The pattern was taken from an older revision of the postinst, so
          #      it matched nothing, silently applied nothing, and then reported
          #      "the gate passed with a clobbering postinst" — the worst possible
          #      outcome, because it reads as "the gate is broken" when the
          #      mutation was simply never made.
          #   2. The replacement contained unescaped `|`, which is sed's
          #      delimiter, so sed died with "unknown option to `s`".
          #
          # So: replace on an exact line, and **assert the replacement happened**
          # before running the gate. A mutation step that cannot tell whether it
          # mutated anything is not a test.

          mutate() { # <file> <exact line to replace> <replacement>
            python3 - "$1" "$2" "$3" <<'PY'
          import sys
          path, old, new = sys.argv[1], sys.argv[2], sys.argv[3]
          body = open(path).read()
          if old not in body:
              sys.exit(f"::error::the text to mutate is not in {path!r}: {old!r}")
          if body.count(old) != 1:
              sys.exit(f"::error::{old!r} appears {body.count(old)} times in {path!r}, not once")
          open(path, "w").write(body.replace(old, new, 1))
          PY
          }

          # (a) A postinst that overwrites a preserved config — the bug that
          #     would silently revert a production unit to defaults, losing its
          #     SMTP credentials and RSVP secret.
          mutate packaging/firmware/omnical/files/postinst \
            '[ -f "$(etc)/rustical/config.toml" ] && CONFIGURED=yes' \
            'if true; then CONFIGURED=yes; else CONFIGURED=yes; fi
          cp "$R/etc/omnical-config.toml.sample" "$(etc)/rustical/config.toml" 2>/dev/null || true'
          if ./scripts/firmware-gate.sh >/dev/null 2>&1; then
            echo "::error::the firmware gate passed with a clobbering postinst — it is not testing anything"
            exit 1
          fi
          echo "ok: rejects a postinst that overwrites a preserved config"
          cp /tmp/postinst.orig packaging/firmware/omnical/files/postinst

          # (b) A postinst that re-seeds the base config on a factory flash.
          #     This is the bug item 13 was built to expose: seeding makes "has a
          #     config" and "is configured" different states, and the server's
          #     guess about which one it is looking at is what swallowed a
          #     misconfiguration and offered the setup wizard to the LAN.
          mutate packaging/firmware/omnical/files/postinst \
            'CONFIGURED=no' \
            'CONFIGURED=no
          if [ ! -f "$(etc)/rustical/config.toml" ]; then
              cp "$R/etc/omnical-config.toml.sample" "$(etc)/rustical/config.toml" 2>/dev/null || true
          fi'
          if ./scripts/firmware-gate.sh >/dev/null 2>&1; then
            echo "::error::the gate passed with a base-config-seeding postinst — setup mode would be ambiguous"
            exit 1
          fi
          echo "ok: rejects a postinst that seeds a base config"
          cp /tmp/postinst.orig packaging/firmware/omnical/files/postinst

          # (c) An init script that refuses to start without a config. Every init
          #     script in this repo does exactly that and it is correct everywhere
          #     else: a factory unit has no config.toml, so this check makes the
          #     setup wizard unreachable and the device a brick with a database.
          mutate router/etc/init.d/rustical \
            '	mkdir -p /usr/local/share/rustical' \
            '	[ -f "$CONFIG" ] || { logger -t rustical "ERROR: $CONFIG missing"; return 1; }
          	mkdir -p /usr/local/share/rustical'
          if ./scripts/firmware-gate.sh >/dev/null 2>&1; then
            echo "::error::the gate passed with an init.d that needs a config — the wizard is unreachable"
            exit 1
          fi
          echo "ok: rejects an init.d that requires a config to exist"

          # (d) An init.d with no support_bundle action (§9.4). "The single
          #     highest-leverage support feature in this whole plan" is
          #     worthless if the owner has to know the subcommand name, and on a
          #     device with no terminal they never find it.
          python3 - <<'PY2'
          p = "router/etc/init.d/rustical"
          body = open(p).read()
          start = body.index("support_bundle() {")
          end = body.index("\n}\n", start) + 3
          open(p, "w").write(body[:start].rstrip("\n") + "\n" + body[end:])
          PY2
          if ./scripts/firmware-gate.sh >/dev/null 2>&1; then
            echo "::error::the gate passed with no support_bundle action — §9.4's best feature is unreachable"
            exit 1
          fi
          echo "ok: rejects an init.d with no support_bundle action"
          cp /tmp/initd.orig router/etc/init.d/rustical

          ./scripts/firmware-gate.sh >/dev/null
          echo "ok: restored, and green again"

  # ── 3. The submodule URL must actually exist ─────────────────────────────
  # Added 2026-09-28, after the first public push. `.gitmodules` pointed at a
  # repository that had never been created, and all three workflows died in
  # 11-19s with `fatal: repository '.../rustical.git' not found` buried inside
  # a checkout step.
  #
  # That failure is loud but nearly useless: the message names a file nobody
  # editing the packaging repo has ever looked at, and the actual mistake — a
  # third repository was never created — is nowhere in it. This job is the one
  # place that can say so in a sentence.
  #
  # It has to live in a job that does NOT check out submodules (hence
  # `submodules: false`, as on the secrets job above): in every other workflow
  # the submodule is already populated by the time a step could run, so the
  # checkout fails first and this never gets a chance to explain.
  #
  # Fails only on a definitive "not found", never on a network error, so a
  # transient outage cannot break the build. That distinction is the whole
  # design: a check that goes red for reasons outside the repo teaches people
  # to ignore it, which is how a real failure gets ignored too.
  submodule-url-exists:
    name: submodule remote is reachable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false

      - name: The rustical submodule URL resolves to a repository
        run: |
          set -euo pipefail
          url="$(git config -f .gitmodules --get submodule.rustical.url)"
          remote="$(git config --get remote.origin.url)"
          echo "superproject remote: $remote"
          echo "rustical submodule URL (as written): $url"

          # Resolve the relative form the way git does. `../rustical.git`
          # against `https://github.com/Bytewheel/Omnical-Code.git` is
          # `https://github.com/Bytewheel/rustical.git` — the OWNER is kept and
          # only the last path segment is replaced. Stripping everything up to
          # `../` instead (the obvious shortcut) yields
          # `https://github.com/rustical.git`, which is a different repository
          # entirely: this check would then report a healthy setup as broken,
          # or a broken one as healthy. It resolves against *our* remote rather
          # than assuming github.com, so a mirror or a self-hosted forge works.
          case "$url" in
            ../*)
              base="${remote%.git}"        # drop the .git suffix
              base="${base%/*}"            # drop the last path segment = the repo name
              url="${base}/${url#../}"     # …and append the submodule's
              ;;
          esac
          echo "resolved to: $url"
          # git-over-SSH needs a key the runner has not got; a submodule URL in
          # that form is still checked by the checkout in every other workflow,
          # and the point of this job is the not-found case.
          case "$url" in
            *@*:*)
              echo "::warning::submodule URL is git-over-SSH ($url) and cannot be probed"
              echo "::warning::without a deploy key here; skipping rather than failing on it"
              exit 0
              ;;
          esac

          out="$(git ls-remote --exit-code "$url" HEAD 2>&1)" && rc=0 || rc=$?
          if [ "$rc" = 0 ]; then
            echo "ok: $url is reachable ($(echo "$out" | cut -f1 | cut -c1-12))"
            exit 0
          fi
          # A transport failure is not this check's business.
          if echo "$out" | grep -qiE 'could not resolve|temporary failure|timeout|proxy|network is unreachable|Connection refused'; then
            echo "::warning::could not reach $url (transport), skipping — this is not a missing repository"
            exit 0
          fi
          echo "::error::the rustical submodule URL does not exist: $url"
          echo "::error::$out"
          echo "::error::Every workflow that checks out submodules fails at the checkout"
          echo "::error::step until that repository exists AND the gitlink commit"
          echo "::error::($(git ls-tree HEAD rustical | awk '{print $3}')) is pushed to it."
          exit 1
