# Omnical — the self-hosting channel (PLAN_DEPLOYMENTS.md §8.1, row 40)
#
#   docker compose -f compose.omnical.yml up -d
#
# On a clean host this is the whole install: the image is built from the source
# in this repository, the configuration is generated by `rustical setup`, the
# database is migrated, an administrator is created, and the server comes up.
# There is no config file to hand-write, which is the entire point — §8.1's gate
# says the Compose path and the tarball path must reach the same state "from one
# config-generation code path (§8.3), not two hand-written configs", and they
# do, because both drive this same command.
#
# ── Before you start: the two answers you must supply ────────────────────────
#
# Put these in a `.env` file next to this one (mode 0600 — it holds a password;
# `.env` is already in .gitignore and the hygiene workflow asserts it is never
# tracked), or export them in your shell:
#
#   OMNICAL_SETUP_ADMIN_EMAIL     who the first administrator is, e.g. you@example.com
#   OMNICAL_SETUP_ADMIN_PASSWORD  their password, 12 characters or more
#
#   OMNICAL_SETUP_PUBLIC_URL      the https:// URL clients will use. Leave it
#                                 unset until your reverse proxy has a hostname;
#                                 the share links need it and are off until then.
#   OMNICAL_SETUP_BIND            default 0.0.0.0:4000 inside the container
#   OMNICAL_SETUP_TLS             proxy | dav-tls | none — advice, printed as
#                                 next steps; it writes no config key
#   OMNICAL_SETUP_REGISTRATION    invite-only | open | closed (default invite-only)
#   OMNICAL_DATA_DIR              where the database lives (default /var/lib/omnical)
#   OMNICAL_PUBLISH               host:port to publish on (default 127.0.0.1:4000)
#
# Every one of these is a flag on `rustical setup` as well; `rustical setup
# --help` is the reference. The two are checked against each other in CI, so a
# variable named here that the binary does not accept fails the build rather
# than silently doing nothing.
#
# ── Why the setup service exists, and why it is not optional ─────────────────
#
# The image is `FROM scratch` (rustical/Dockerfile:44) — one static binary, no
# shell, which is the right trade for a 5 MB image. It also means there is no
# `sh -c 'printf … | rustical setup'`, and `stdin_open: true` would leave the
# wizard blocked on a read that never ends. So the wizard takes its answers from
# the environment instead: `OMNICAL_SETUP_*`, via `rustical setup --unattended`.
# That is the only way this file can be `up`-able with nobody at the keyboard,
# and it is why unattended mode exists at all.
#
# `omnical-setup` is therefore a real service, not a comment. It runs to
# completion, writes the config into the `config` volume, and the server waits
# for it. It is safe to re-run — `rustical setup` is idempotent by design, and a
# re-run edits rather than clobbers. Which means: change a value in `.env`,
# `docker compose up -d` again, and the change is applied to the live install.
# It also means the setup container is the place the wizard's output goes:
#
#   docker compose -f compose.omnical.yml logs omnical-setup
#
# ── What this file deliberately does not do ──────────────────────────────────
#
# * No TLS. `Config` has no TLS section because TLS is somebody else's job in
#   every channel: a reverse proxy in front, or the `dav-tls` binary. Point
#   Caddy/nginx/Traefik at the published port and hand it the hostname from
#   OMNICAL_SETUP_PUBLIC_URL. A commented Caddy service is at the bottom of this
#   file for exactly that reason.
# * No mail. An unattended run never reads or writes a mail password — that
#   value would land in a volume, an `inspect` output and a CI log. Add SMTP by
#   running the wizard against the volume with a terminal attached:
#
#     docker compose -f compose.omnical.yml run --rm omnical-setup
#
#   which runs `rustical setup` interactively, reuses the same config and the
#   same database, and asks only the mail questions.
# * No published image tag. `build:` below, from this repository. Pushing an
#   image is Workstream B's job (§7.1, item 15) and does not exist yet; the
#   hosted `Dockerfile` will replace this context and this line.

name: omnical

# One place for the paths that must agree. The database path is named twice —
# once for the wizard, once for the server — and the two must be the same file
# or the server silently comes up on an empty database with no administrator in
# it. A YAML alias cannot be part of a larger scalar, so `&data-dir` and
# `&db-url` are two spellings of the same fact and cannot be written as one; the
# `selfhost` job in .github/workflows/build.yml asserts `db-url` really is
# `data-dir` + "/db.sqlite3" and that both are used where they belong.
x-omnical-data-dir: &data-dir /var/lib/omnical
x-omnical-db-url: &db-url /var/lib/omnical/db.sqlite3
x-omnical-config: &config-file /etc/omnical/config.toml

services:
  # ── 1. Generate the configuration, migrate, create the administrator ────────
  omnical-setup:
    build:
      # rustical/Dockerfile is upstream's, inherited and unused until now. It is
      # kept as the self-host build until item 15 lands a top-level `Dockerfile`
      # for the hosted image; nothing about it is Omnical-specific.
      context: ./rustical
      dockerfile: Dockerfile
    image: omnical:local
    # Runs to completion and exits 0. `restart: "no"` is what makes that a
    # decision rather than an accident — otherwise compose restarts the wizard
    # forever, and each pass would re-prompt an operator who is not there.
    restart: "no"
    entrypoint: ["/usr/local/bin/rustical"]
    command: ["--config-file", *config-file, "setup", "--unattended"]
    environment:
      OMNICAL_SETUP_DATA_DIR: *data-dir
      OMNICAL_SETUP_BIND: "0.0.0.0:4000"
      OMNICAL_SETUP_TLS: "proxy"
      OMNICAL_SETUP_REGISTRATION: "invite-only"
      # Deliberately NOT defaulted. An absent value is a loud failure naming the
      # variable, not a default account with a default password.
      OMNICAL_SETUP_ADMIN_EMAIL: ${OMNICAL_SETUP_ADMIN_EMAIL:?set OMNICAL_SETUP_ADMIN_EMAIL in .env — see the header of this file}
      OMNICAL_SETUP_ADMIN_PASSWORD: ${OMNICAL_SETUP_ADMIN_PASSWORD:?set OMNICAL_SETUP_ADMIN_PASSWORD in .env — 12 characters or more}
      # Optional on purpose: no reverse proxy hostname yet is a normal state for
      # a first run, and it is honoured as "share links off" rather than an
      # error. Never set it to a value you have not got a certificate for.
      OMNICAL_SETUP_PUBLIC_URL: ${OMNICAL_SETUP_PUBLIC_URL:-}
    volumes:
      - config:/etc/omnical
      - data:*data-dir

  # ── 2. Serve ───────────────────────────────────────────────────────────────
  omnical:
    image: omnical:local
    depends_on:
      omnical-setup:
        # The gate: the server does not start until the config exists. Without
        # this, `up` races the wizard and the first request 500s.
        condition: service_completed_successfully
    restart: unless-stopped
    entrypoint: ["/usr/local/bin/rustical"]
    command: ["--config-file", *config-file, "serve"]
    environment:
      # rustical/Dockerfile:54 bakes this in, and figment merges the environment
      # *after* the config file (main.rs:19-26), so the image's value would
      # override the one the wizard just wrote. Left alone, the server would run
      # on a second, empty database in a different directory — no admin, an
      # empty portal, and nothing in the logs to say why.
      RUSTICAL_DATA_STORE__SQLITE__DB_URL: *db-url
    volumes:
      # Read-only: the server has no business writing its own configuration.
      # Only `omnical-setup` writes here.
      - config:/etc/omnical:ro
      - data:*data-dir
    ports:
      # Loopback by default, on purpose. A DAV server with no TLS in front of it
      # is a password and a calendar in cleartext, and the most likely accident
      # here is publishing 0.0.0.0:4000 to the internet and forgetting. Set
      # OMNICAL_PUBLISH=0.0.0.0:4000 when you have a proxy terminating TLS in
      # front, and only then.
      - "${OMNICAL_PUBLISH:-127.0.0.1:4000}:4000"
    # /ping is unauthenticated and cheap. The inherited HEALTHCHECK
    # (rustical/Dockerfile:60) shells out to `rustical health`, which the
    # scratch image cannot do, so it is restated as a plain HTTP call.
    healthcheck:
      test: ["CMD", "/usr/local/bin/rustical", "--config-file", "/etc/omnical/config.toml", "health"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3

volumes:
  # Named volumes, not bind mounts: a DAV database plus its WAL is a directory
  # that must not be half-owned by a host path, and `docker compose down -v`
  # is the only safe "start over" for a self-hoster.
  config:
  data:

# ── Optional: TLS in front, in the same file ─────────────────────────────────
#
# Uncomment and set OMNICAL_PUBLISH=127.0.0.1:4000 (the default) plus
# OMNICAL_SETUP_PUBLIC_URL=https://your.hostname. Caddy obtains and renews the
# certificate itself; the ACME HTTP challenge needs ports 80/443 reachable from
# the internet, which is a port-forward and a DNS record, not a container
# setting. It is commented out rather than shipped enabled because getting it
# wrong on someone else's server is worse than not having it.
#
#   caddy:
#     image: caddy:2-alpine
#     restart: unless-stopped
#     ports:
#       - "80:80"
#       - "443:443"
#     volumes:
#       - ./Caddyfile:/etc/caddy/Caddyfile:ro
#       - caddy-data:/data
#     # Then: OMNICAL_SETUP_PUBLIC_URL=https://cal.example.com
#
#   # Caddyfile
#   # cal.example.com {
#   #     # WebDAV Push and PROPFIND are not GETs; Caddy needs to be told this is
#   #     # a WebDAV endpoint or it rewrites paths and the clients break.
#   #     reverse_proxy omnical:4000 {
#   #         transport http { read_timeout 0 }
#   #     }
#   # }
#
# volumes:
#   caddy-data:
